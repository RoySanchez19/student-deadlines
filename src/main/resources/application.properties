spring.application.name=student-deadlines

spring.datasource.url=jdbc:postgresql://localhost:5432/deadlines
spring.datasource.username=deadlines
spring.datasource.password=localdev

# Flyway es el dueno del esquema. Hibernate solo comprueba que las entidades
# coincidan con lo que las migraciones crearon: si no coinciden, la app no
# arranca. Con `update` Hibernate modificaria la base por su cuenta y el
# esquema real dejaria de estar descrito en ningun sitio versionado.
spring.jpa.hibernate.ddl-auto=validate

# Cierra la sesion de JPA al terminar el servicio, no al terminar la respuesta
# HTTP. Evita consultas perezosas disparadas desde la capa web sin querer.
spring.jpa.open-in-view=false
